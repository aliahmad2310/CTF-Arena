<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Overview - CTF Arena</title>
  <meta name="description" content="Engage with practical challenges and flags inside this interactive cybersecurity lab.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>

  <main class="site-main container">
    <!-- Breadcrumb -->
    <div style="margin-bottom: var(--space-4); font-size: var(--text-xs); font-family: var(--font-mono);">
      <a href="/labs.html" class="text-dim">Labs</a>
      <span class="text-dim" style="margin: 0 0.4rem;">/</span>
      <span id="breadcrumb-title" class="text-green">Loading...</span>
    </div>

    <!-- Lab Overview Card -->
    <div class="card" style="margin-bottom: var(--space-8);">
      <div class="card-header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span id="lab-difficulty" class="badge badge-grey">Difficulty</span>
          <span id="lab-status-badge"></span>
        </div>
        <span id="lab-points-total" class="text-mono text-green text-sm" style="font-weight: 700;">0 PTS</span>
      </div>

      <div class="card-body">
        <h1 id="lab-title" style="font-size: var(--text-3xl); margin-bottom: var(--space-2);">--</h1>
        <p id="lab-description" class="text-main" style="line-height: 1.6; margin-bottom: var(--space-5);">--</p>

        <!-- Progress Indicator -->
        <div style="margin-bottom: var(--space-4); max-width: 500px;">
          <div style="display: flex; justify-content: space-between; font-size: var(--text-xs); font-family: var(--font-mono); margin-bottom: var(--space-1);">
            <span class="text-dim">LAB COMPLETION</span>
            <span id="progress-text" class="text-green">0 / 0 SOLVED (0%)</span>
          </div>
          <div class="progress-container">
            <div id="progress-bar-fill" class="progress-bar" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Tags -->
        <div id="lab-tags" style="display: flex; flex-wrap: wrap; gap: 0.35rem;"></div>
      </div>
    </div>

    <!-- Challenges Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4);">
      <h2 style="font-size: var(--text-xl); margin: 0;">Challenges in this Lab</h2>
      <span id="challenges-count-badge" class="badge badge-grey">0 Challenges</span>
    </div>

    <!-- Challenges List Grid -->
    <div id="challenges-container" class="flex-col gap-4">
      <!-- Loading Skeleton -->
      <div class="card" style="padding: var(--space-4);">
        <div class="skeleton" style="height: 20px; width: 40%; margin-bottom: var(--space-2);"></div>
        <div class="skeleton" style="height: 14px; width: 70%;"></div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/lab.js"></script>
</body>
</html>
