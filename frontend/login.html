<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CTF Arena</title>
  <meta name="description" content="Access your CTF Arena competitor account, submit flags, and monitor the live scoreboard.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>

  <main class="site-main container" style="max-width: 440px;">
    <div class="card">
      <div class="card-header">
        <h1 style="font-size: var(--text-xl); margin: 0;">Competitor Access</h1>
        <span class="badge badge-grey">Terminal</span>
      </div>
      <div class="card-body">
        <p class="text-dim" style="font-size: var(--text-xs); margin-bottom: var(--space-4);">
          Authenticate with your registered credentials to enter active labs.
        </p>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="operator@domain.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
              <label class="form-label" for="password" style="margin: 0;">Password</label>
              <a href="/forgot-password.html" style="font-size: var(--text-xs);">Forgot Password?</a>
            </div>
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">
            Authenticate
          </button>
        </form>
      </div>
      <div class="card-footer" style="text-align: center; font-size: var(--text-xs);">
        Need an account? <a href="/signup.html">Register Here</a>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
