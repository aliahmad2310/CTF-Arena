<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - CTF Arena</title>
  <meta name="description" content="Manage your competitor profile, display preferences, and account credentials.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>

  <main class="site-main container" style="max-width: 680px;">
    <div style="margin-bottom: var(--space-6);">
      <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-1);">Account Settings</h1>
      <p class="text-dim">Update personal competitor metadata and security credentials.</p>
    </div>

    <!-- Profile Metadata Form -->
    <div class="card" style="margin-bottom: var(--space-6);">
      <div class="card-header">
        <h2 style="font-size: var(--text-base); margin: 0;">Profile Information</h2>
        <span id="role-badge" class="badge badge-grey">User</span>
      </div>
      <div class="card-body">
        <form id="profile-form">
          <div class="form-group">
            <label class="form-label" for="username">Username (Immutable)</label>
            <input type="text" id="username" class="form-input form-input-mono" disabled>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" disabled>
          </div>

          <div class="form-group">
            <label class="form-label" for="display-name">Display Name</label>
            <input type="text" id="display-name" class="form-input" required minlength="2" maxlength="50">
          </div>

          <div class="form-group">
            <label class="form-label" for="avatar-url">Avatar Image URL (Optional)</label>
            <input type="url" id="avatar-url" class="form-input" placeholder="https://example.com/avatar.png">
          </div>

          <button type="submit" id="save-profile-btn" class="btn btn-primary">
            Save Profile Changes
          </button>
        </form>
      </div>
    </div>

    <!-- Security & Password Form -->
    <div class="card">
      <div class="card-header">
        <h2 style="font-size: var(--text-base); margin: 0;">Security Credentials</h2>
        <span class="badge badge-grey">Authentication</span>
      </div>
      <div class="card-body">
        <form id="password-form">
          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <input type="password" id="new-password" class="form-input" required minlength="8" placeholder="••••••••••••">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-new-password">Confirm New Password</label>
            <input type="password" id="confirm-new-password" class="form-input" required minlength="8" placeholder="••••••••••••">
          </div>

          <button type="submit" id="save-password-btn" class="btn btn-secondary">
            Update Passphrase
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/settings.js"></script>
</body>
</html>
