<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - CTF Arena</title>
  <meta name="description" content="Update your account credentials after password reset verification.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>

  <main class="site-main container" style="max-width: 440px;">
    <div class="card">
      <div class="card-header">
        <h1 style="font-size: var(--text-xl); margin: 0;">Update Password</h1>
        <span class="badge badge-amber">Action Required</span>
      </div>
      <div class="card-body">
        <p class="text-dim" style="font-size: var(--text-xs); margin-bottom: var(--space-4);">
          Establish a new secure access passphrase for your competitor profile.
        </p>

        <form id="reset-form">
          <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required minlength="8">
            <div class="form-helper">Minimum 8 characters.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="••••••••••••" required minlength="8">
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">
            Store New Password
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
