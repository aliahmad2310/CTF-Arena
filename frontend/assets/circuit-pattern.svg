<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- CTF Arena Motherboard Circuit Tile - Dense Variant -->
  <!-- Strict Rule: Absolutely zero emoji anywhere in this file. -->

  <defs>
    <!-- Glowing Node Halo Filter -->
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subdued Trace Style -->
    <style>
      .trace { stroke: rgba(53, 168, 255, 0.35); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .trace-accent { stroke: rgba(0, 240, 255, 0.65); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .via-outer { fill: #0a1428; stroke: #35a8ff; stroke-width: 1.5; }
      .via-inner { fill: #ffffff; }
      .bus-dot { fill: rgba(53, 168, 255, 0.5); }
      .chip-rect { fill: rgba(10, 20, 40, 0.6); stroke: rgba(53, 168, 255, 0.3); stroke-width: 1; }
    </style>
  </defs>

  <!-- Small Integrated Circuit Chip Outline 1 -->
  <rect x="20" y="30" width="36" height="60" rx="2" class="chip-rect" />
  <!-- IC Pins -->
  <line x1="14" y1="42" x2="20" y2="42" class="trace" />
  <line x1="14" y1="52" x2="20" y2="52" class="trace" />
  <line x1="14" y1="62" x2="20" y2="62" class="trace" />
  <line x1="14" y1="72" x2="20" y2="72" class="trace" />
  <line x1="56" y1="42" x2="62" y2="42" class="trace" />
  <line x1="56" y1="52" x2="62" y2="52" class="trace" />
  <line x1="56" y1="62" x2="62" y2="62" class="trace" />
  <line x1="56" y1="72" x2="62" y2="72" class="trace" />

  <!-- Trace Path 1: 45-degree angle routing to node -->
  <path d="M 14 42 L 2 42" class="trace" />
  <path d="M 62 42 L 90 42 L 120 72 L 120 150" class="trace-accent" />
  <circle cx="120" cy="150" r="4" class="via-outer" filter="url(#node-glow)" />
  <circle cx="120" cy="150" r="1.5" class="via-inner" />

  <path d="M 62 62 L 80 62 L 105 87 L 105 130" class="trace" />
  <circle cx="105" cy="130" r="3" class="via-outer" />
  <circle cx="105" cy="130" r="1" class="via-inner" />

  <!-- Central Bus Track with 45-degree bends -->
  <path d="M 200 0 L 200 80 L 170 110 L 170 200 L 190 220 L 190 280" class="trace-accent" />
  <circle cx="190" cy="280" r="4.5" class="via-outer" filter="url(#node-glow)" />
  <circle cx="190" cy="280" r="2" class="via-inner" />

  <path d="M 220 0 L 220 75 L 250 105 L 250 190 L 230 210 L 230 260" class="trace" />
  <circle cx="230" cy="260" r="3.5" class="via-outer" />
  <circle cx="230" cy="260" r="1.5" class="via-inner" />

  <!-- Parallel Data Track Array (Right Side) -->
  <line x1="280" y1="40" x2="350" y2="40" class="trace" />
  <path d="M 350 40 L 380 70 L 380 140" class="trace" />
  <circle cx="380" cy="140" r="3" class="via-outer" />

  <path d="M 270 90 L 320 90 L 350 120 L 350 200 L 310 240 L 310 320" class="trace-accent" />
  <circle cx="310" cy="320" r="4" class="via-outer" filter="url(#node-glow)" />
  <circle cx="310" cy="320" r="1.5" class="via-inner" />

  <!-- Vertical Chip Component 2 -->
  <rect x="290" y="140" width="28" height="48" rx="2" class="chip-rect" />
  <line x1="284" y1="152" x2="290" y2="152" class="trace" />
  <line x1="284" y1="162" x2="290" y2="162" class="trace" />
  <line x1="284" y1="172" x2="290" y2="172" class="trace" />

  <!-- Lower Left Diagonal Bus -->
  <path d="M 0 320 L 60 320 L 110 270 L 110 210 L 70 170 L 30 170" class="trace" />
  <circle cx="30" cy="170" r="3.5" class="via-outer" />
  <circle cx="30" cy="170" r="1.5" class="via-inner" />

  <path d="M 20 400 L 20 360 L 60 320 L 140 320 L 170 350 L 170 400" class="trace-accent" />
  <circle cx="140" cy="320" r="4" class="via-outer" filter="url(#node-glow)" />
  <circle cx="140" cy="320" r="1.5" class="via-inner" />

  <!-- Vertical Pin Arrays (Like in Reference Image) -->
  <circle cx="150" cy="160" r="2" class="bus-dot" />
  <circle cx="150" cy="172" r="2" class="bus-dot" />
  <circle cx="150" cy="184" r="2" class="bus-dot" />
  <circle cx="150" cy="196" r="2" class="bus-dot" />
  <circle cx="150" cy="208" r="2" class="bus-dot" />

  <circle cx="260" cy="130" r="2" class="bus-dot" />
  <circle cx="260" cy="142" r="2" class="bus-dot" />
  <circle cx="260" cy="154" r="2" class="bus-dot" />
  <circle cx="260" cy="166" r="2" class="bus-dot" />

  <!-- Horizontal Solder Arrays -->
  <circle cx="60" cy="250" r="2" class="bus-dot" />
  <circle cx="72" cy="250" r="2" class="bus-dot" />
  <circle cx="84" cy="250" r="2" class="bus-dot" />

  <!-- Bottom Right Diagonal Traces -->
  <path d="M 240 400 L 240 340 L 270 310 L 360 310 L 390 340 L 390 400" class="trace" />
  <path d="M 330 250 L 370 250 L 400 280" class="trace" />
  <circle cx="330" cy="250" r="3" class="via-outer" />
  <circle cx="330" cy="250" r="1" class="via-inner" />
</svg>
