  <!-- Central Micro Solder Pad Node -->
  <circle cx="16" cy="16" r="3" fill="#050b18" stroke="#35a8ff" stroke-width="1.5" />
  <circle cx="16" cy="16" r="1.2" fill="#ffffff" />
  <line x1="16" y1="9" x2="16" y2="13" stroke="#35a8ff" stroke-width="1.2" />
