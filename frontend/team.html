<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Hub - CTF</title>
  <meta name="description" content="View your squad standings, solves, and members on CTF.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>

  <main class="site-main container">
    <!-- State A: Not In A Team Panel (hidden by default) -->
    <div id="no-team-view" class="hidden" style="max-width: 540px; margin: var(--space-12) auto; text-align: center;">
      <div class="card">
        <div class="card-body" style="padding: var(--space-8);">
          <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-2);">Squad Roster</h1>
          <p class="text-dim" style="margin: 0;">Your account has not been assigned to a squad yet. Please contact your competition administrator.</p>
        </div>
      </div>
    </div>

    <!-- State B: Active Team Hub Panel (hidden by default) -->
    <div id="active-team-view" class="hidden">
      <!-- Team Header Overview: Name, Position (Rank), and Points -->
      <div class="card" style="margin-bottom: var(--space-6);">
        <div class="card-body" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4);">
          <div>
            <h1 id="team-name" style="font-size: var(--text-2xl); margin: 0 0 var(--space-1);">--</h1>
            <div class="text-dim text-xs text-mono" id="team-member-count">0 members</div>
          </div>

          <div style="display: flex; align-items: center; gap: var(--space-8);">
            <div>
              <div class="text-dim text-xs text-mono">TEAM RANK</div>
              <div id="team-rank" class="text-cyan text-mono" style="font-size: var(--text-2xl); font-weight: 700;">--</div>
            </div>
            <div>
              <div class="text-dim text-xs text-mono">TEAM POINTS</div>
              <div id="team-score" class="text-green text-mono" style="font-size: var(--text-2xl); font-weight: 700;">0</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Team Members Roster: Members, Labs Solved, Points of individual person -->
      <div class="card">
        <div class="card-header">
          <h2 style="font-size: var(--text-base); margin: 0;">Squad Members</h2>
        </div>
        <div class="table-container" style="border: none; border-radius: 0;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Member</th>
                <th>Labs Solved</th>
                <th style="text-align: right;">Points</th>
              </tr>
            </thead>
            <tbody id="roster-tbody">
              <tr>
                <td colspan="3" style="text-align: center; color: var(--text-dim); padding: var(--space-6);">
                  Loading roster...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/team.js"></script>
</body>
</html>
