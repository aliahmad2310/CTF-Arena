<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Scoreboard - CTF Arena</title>
  <meta name="description" content="Live real-time leaderboard rankings, score timeline progressions, and team standings on CTF Arena.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/admin.css">

</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>
  <div id="admin-subnav-root"></div>

  <main class="site-main container">
    <!-- Header -->
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6);">
      <div>
        <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-1); flex-wrap: wrap;">
          <h1 style="font-size: var(--text-3xl); margin: 0;">Global Scoreboard</h1>
          <span id="leaderboard-countdown-badge" class="badge badge-grey font-mono" style="font-size: var(--text-xs); letter-spacing: 0.05em;" title="Time until next scoreboard data refresh">
            Updating in <span id="leaderboard-countdown-sec">15</span>s
          </span>
          <div id="admin-refresh-box" style="display: none; align-items: center; gap: 0.35rem;">
            <label class="sr-only" for="admin-refresh-input">Refresh interval in seconds</label>
            <input id="admin-refresh-input" type="number" min="1" max="3600" value="15" class="form-input form-input-mono" style="width: 4.5rem; height: 1.85rem; padding: 0.2rem 0.4rem; font-size: 0.75rem;" title="Admin: Set refresh interval in seconds">
            <button id="admin-refresh-save-btn" type="button" class="btn btn-xs btn-secondary" style="height: 1.85rem; padding: 0 0.6rem; font-size: 0.72rem;">
              Set Sec
            </button>
          </div>
        </div>
        <p id="leaderboard-subtitle" class="text-dim" style="margin: 0; font-size: var(--text-sm);">
          Live rankings update automatically. Earliest timestamp breaks score ties.
        </p>
      </div>

      <!-- Search Input -->
      <div style="min-width: 240px;">
        <input type="text" id="leaderboard-search" class="form-input form-input-mono" placeholder="Search team or name...">
      </div>
    </div>

    <!-- Leaderboard Tabs & Table Card -->
    <div class="card">
      <div class="card-header" style="padding: 0; background-color: var(--bg-surface); display: flex;">
        <button type="button" id="tab-teams" class="btn" style="flex: 1; border-radius: 0; background: var(--bg-card); color: var(--accent-green); border-bottom: 2px solid var(--accent-green);">
          Teams Ranking
        </button>
        <button type="button" id="tab-users" class="btn" style="flex: 1; border-radius: 0; background: var(--bg-surface); color: var(--text-muted); border-bottom: 2px solid transparent;">
          Individual Competitors
        </button>
      </div>

      <div class="table-container" style="border: none; border-radius: 0;">
        <table class="data-table">
          <thead id="leaderboard-thead">
            <tr>
              <th style="width: 80px;">Rank</th>
              <th>Team</th>
              <th>Members</th>
              <th>Solves</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-dim); padding: var(--space-8);">
                Loading live standings...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer" style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap;">
        <span id="leaderboard-page-info" class="text-dim text-xs text-mono" aria-live="polite">Showing 0-0 of 0 teams - Page 1 of 1</span>
        <div style="display:flex;gap:var(--space-2);">
          <button id="leaderboard-prev" type="button" class="btn btn-secondary btn-xs" disabled>Previous</button>
          <button id="leaderboard-next" type="button" class="btn btn-secondary btn-xs" disabled>Next</button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/leaderboard.js"></script>
</body>
</html>
