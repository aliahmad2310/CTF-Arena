<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CTF Arena</title>
  <meta name="description" content="Request a secure password reset token for your CTF Arena account.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>

  <main class="site-main container" style="max-width: 440px;">
    <div class="card">
      <div class="card-header">
        <h1 style="font-size: var(--text-xl); margin: 0;">Password Recovery</h1>
        <span class="badge badge-grey">Security</span>
      </div>
      <div class="card-body">
        <p class="text-dim" style="font-size: var(--text-xs); margin-bottom: var(--space-4);">
          Enter your registered email address to receive a secure password reset authorization link.
        </p>

        <form id="forgot-form">
          <div class="form-group">
            <label class="form-label" for="email">Account Email</label>
            <input type="email" id="email" class="form-input" placeholder="operator@domain.com" required>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">
            Dispatch Reset Email
          </button>
        </form>
      </div>
      <div class="card-footer" style="text-align: center; font-size: var(--text-xs);">
        Remember your password? <a href="/login.html">Return to Login</a>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
