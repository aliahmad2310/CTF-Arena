<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Championship Countdown - CTF Arena</title>
  <meta name="description" content="View and update the CTF Arena championship countdown.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>
  <div id="admin-subnav-root"></div>

  <main class="site-main container" style="max-width: 860px;">
    <section class="hero-section" style="text-align:center;">
      <span id="championship-status" class="badge badge-grey">Loading schedule</span>
      <h1 id="championship-title" style="font-size:var(--text-3xl);margin:var(--space-4) 0 var(--space-2);">CTF Arena Championship</h1>
      <p id="countdown-label" class="text-dim" style="margin:0 0 var(--space-5);">Championship countdown</p>
      <div id="championship-countdown" class="countdown-grid" role="button" tabindex="0" aria-label="Double-click to edit championship countdown">
        <div class="countdown-block"><div id="countdown-days" class="countdown-value">--</div><div class="countdown-label">Days</div></div>
        <div class="countdown-block"><div id="countdown-hours" class="countdown-value">--</div><div class="countdown-label">Hours</div></div>
        <div class="countdown-block"><div id="countdown-minutes" class="countdown-value">--</div><div class="countdown-label">Minutes</div></div>
        <div class="countdown-block"><div id="countdown-seconds" class="countdown-value">--</div><div class="countdown-label">Seconds</div></div>
      </div>
      <p class="text-dim text-xs" style="margin-top:var(--space-4);">Double-click the countdown, or focus it and press Enter, to edit the championship schedule.</p>
      <form id="countdown-editor" class="card hidden" style="max-width:560px;margin:var(--space-6) auto 0;text-align:left;">
        <div class="card-body">
          <h2 style="font-size:var(--text-lg);margin:0 0 var(--space-4);">Edit Championship Countdown</h2>
          <div class="form-group">
            <label class="form-label" for="editor-title">Championship title</label>
            <input id="editor-title" class="form-input" type="text" required minlength="3" maxlength="100">
          </div>
          <div class="form-group">
            <label class="form-label" for="editor-target">Countdown target</label>
            <select id="editor-target" class="form-select">
              <option value="start_time">Championship starts</option>
              <option value="end_time">Championship ends</option>
            </select>
          </div>
          <div class="form-group">
            <label id="editor-date-label" class="form-label" for="editor-date">Start date and time</label>
            <input id="editor-date" class="form-input form-input-mono" type="datetime-local" required>
            <div class="form-helper">Time is interpreted in your browser's local timezone and saved as UTC.</div>
          </div>
          <div style="display:flex;gap:var(--space-2);justify-content:flex-end;">
            <button id="cancel-countdown-edit" type="button" class="btn btn-secondary">Cancel</button>
            <button id="save-countdown-edit" type="submit" class="btn btn-primary">Save Schedule</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/admin/index.js"></script>
</body>
</html>
