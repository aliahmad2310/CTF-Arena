<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge - CTF</title>
  <meta name="description" content="Solve interactive security challenge and capture the flag on CTF.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/background.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages.css">

  <!-- Markdown Rendering & XSS Sanitization Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
</head>
<body class="site-wrapper">
  <div id="navbar-root"></div>

  <main class="site-main container" style="max-width: 900px;">
    <!-- Breadcrumb -->
    <div style="margin-bottom: var(--space-4); font-size: var(--text-xs); font-family: var(--font-mono);">
      <a href="/labs.html" class="text-dim">Labs</a>
      <span class="text-dim" style="margin: 0 0.4rem;">/</span>
      <a id="breadcrumb-lab-link" href="#" class="text-dim">Lab</a>
      <span class="text-dim" style="margin: 0 0.4rem;">/</span>
      <span id="breadcrumb-challenge-title" class="text-green">Challenge</span>
    </div>

    <!-- Challenge Main Card -->
    <div class="card" style="margin-bottom: var(--space-6);">
      <div class="card-header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span id="ch-category" class="badge badge-grey">Category</span>
          <span id="ch-difficulty" class="badge badge-grey">Difficulty</span>
          <span id="ch-status-badge"></span>
        </div>
        <div style="display: flex; align-items: center; gap: var(--space-4);">
          <span id="ch-solves-count" class="text-dim text-mono text-xs">0 Solves</span>
          <span id="ch-points" class="text-mono text-green text-base" style="font-weight: 700;">+0 PTS</span>
        </div>
      </div>

      <div class="card-body">
        <h1 id="ch-title" style="font-size: var(--text-2xl); margin-bottom: var(--space-4);">Loading Challenge...</h1>

        <!-- Sanitized Markdown Content -->
        <div id="ch-description" style="line-height: 1.7; margin-bottom: var(--space-6); color: var(--text-main);">
          <div class="skeleton" style="height: 20px; width: 80%; margin-bottom: var(--space-2);"></div>
          <div class="skeleton" style="height: 20px; width: 60%; margin-bottom: var(--space-2);"></div>
          <div class="skeleton" style="height: 20px; width: 70%;"></div>
        </div>

        <!-- Target / Host Connection Box -->
        <div id="ch-target-box" class="hidden" style="margin-bottom: var(--space-6); background-color: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: var(--radius-sm); padding: var(--space-4);">
          <div class="text-mono text-dim text-xs" style="margin-bottom: var(--space-2); font-weight: 700;">TARGET DEPLOYMENT:</div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);">
            <code id="ch-target-val" class="text-cyan text-mono" style="font-size: var(--text-sm);">--</code>
            <a id="ch-target-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline">
              Open Target
            </a>
          </div>
        </div>

        <!-- Attachments Section -->
        <div id="ch-files-section" class="hidden" style="margin-bottom: var(--space-6);">
          <h3 style="font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: var(--space-3);">
            Challenge Artifacts
          </h3>
          <div id="ch-files-list" class="flex-col gap-2"></div>
        </div>

        <!-- Hints Section -->
        <div id="ch-hints-section" class="hidden" style="margin-bottom: var(--space-6);">
          <h3 style="font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: var(--space-3);">
            Intelligence Hints
          </h3>
          <div id="ch-hints-list" class="flex-col gap-2"></div>
        </div>
      </div>

      <!-- Flag Submission Panel -->
      <div id="submission-card-footer" class="card-footer" style="padding: var(--space-5); background-color: var(--bg-surface);">
        <form id="flag-submit-form" style="display: flex; flex-wrap: wrap; gap: var(--space-3);">
          <div style="flex: 1; min-width: 280px;">
            <input type="text" id="flag-input" class="form-input form-input-mono" placeholder="CTF{flag_string_here}" required autocomplete="off">
          </div>
          <button type="submit" id="flag-submit-btn" class="btn btn-primary">
            Submit Flag
          </button>
        </form>
        <div id="flag-response-msg" class="hidden" style="margin-top: var(--space-3); font-size: var(--text-sm); font-family: var(--font-mono);"></div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module" src="/js/pages/challenge.js"></script>
</body>
</html>
