# fly.toml app configuration file generated for ctf-arena-backend

app = "ctf-arena-backend"
primary_region = "iad" # (or whichever region is closest to you, e.g., "sjc", "ams")

[build]
  # Fly.io will use a Dockerfile to build and run your FastAPI backend
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8008
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
